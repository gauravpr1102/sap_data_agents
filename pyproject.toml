[project]
name = "sapkit"
version = "0.1.0"
description = "SAP planning and procurement agents on Claude, for a dummy SAP client"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.13",
  "duckdb>=1.1",
  "pandas>=2",          # DuckDB probes for pandas on every parameterised query; without it each probe is a slow failed import
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sapkit = "sapkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
